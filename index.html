<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>My To-Do List</h1>
    </header>

    <main>
      <form id="task-form">
        <label for="task-input">New task</label>
        <div class="form-row">
          <input id="task-input" type="text" placeholder="What do you need to do? Enter task.">
          <button type="submit">Add</button>
        </div>
      </form>

      <p id="message"></p>

      <ul id="task-list"></ul>
    </main>

    <footer>
      <p>Click a task to mark it done.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
